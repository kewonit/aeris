services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RELAY_DATA_DIR: /var/lib/aeris-relay
    expose:
      - "8080"
    volumes:
      - relay-data:/var/lib/aeris-relay
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      RELAY_HOSTNAME: ${RELAY_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
