name: Test ADS-B relay

on:
  pull_request:
    paths:
      - "services/adsb-relay/**"
      - ".github/workflows/test-adsb-relay.yml"
  push:
    branches: [main]
    paths:
      - "services/adsb-relay/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/adsb-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/adsb-relay/go.sum
      - run: go test -race ./...
      - run: go vet ./...
